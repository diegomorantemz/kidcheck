services:
  db:
    image: mysql:8.4
    container_name: kidcheck-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: kidcheck
      TZ: America/Lima
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - kidcheck-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    container_name: kidcheck-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: kidcheck
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-kidcheck-dev-secret-cambiar-en-produccion-32bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:5173}
      KIDCHECK_JOBS_ENABLED: ${KIDCHECK_JOBS_ENABLED:-true}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build: ./web
    container_name: kidcheck-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      PORT: 3000
      ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "${WEB_PORT:-5173}:3000"

volumes:
  kidcheck-db-data:
