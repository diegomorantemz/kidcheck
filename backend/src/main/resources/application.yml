server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: kidcheck-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kidcheck}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

kidcheck:
  jwt:
    secret: ${JWT_SECRET:kidcheck-dev-secret-cambiar-en-produccion-32bytes}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-hours: ${JWT_REFRESH_HOURS:8}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  web:
    url: ${WEB_PUBLIC_URL:http://localhost:5173}
  notificaciones:
    intervalo-ms: ${NOTIF_INTERVALO_MS:30000}
    max-intentos: ${NOTIF_MAX_INTENTOS:3}
    twilio:
      habilitado: ${TWILIO_ENABLED:false}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  jobs:
    habilitado: ${KIDCHECK_JOBS_ENABLED:true}
    inasistencia-cron: ${KIDCHECK_JOB_INASISTENCIA_CRON:0 */5 * * * *}
    reincidencia-cron: ${KIDCHECK_JOB_REINCIDENCIA_CRON:0 0 16 * * FRI}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    pe.edu.kidcheck: INFO
    org.flywaydb: INFO
